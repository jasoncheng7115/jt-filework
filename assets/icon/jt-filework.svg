<?xml version="1.0" encoding="UTF-8"?>
<!--
  JT FileWork application icon — master artwork, for 128px and above.

  The mark is the product's own architecture: a recursive split workspace
  (AGENTS.md 6) with one active pane, and a single amber dot for the
  CView-style mark that AGENTS.md 10 keeps distinct from selection.

  Accent colours are the theme tokens from src/core/src/theme.rs, so the icon
  and the application cannot drift apart:
    selection.active (dark)  #2F6FC4
    mark.active      (dark)  #E88A3C

  Small sizes use their own artwork: jt-filework-32.svg and
  jt-filework-16.svg. See assets/icon/README.md.

  Canvas is 1024x1024 with the macOS content square of 824x824 inset at 100.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#3E63A0"/>
      <stop offset="0.55" stop-color="#274372"/>
      <stop offset="1"    stop-color="#16233A"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A1424" flood-opacity="0.5"/>
    </filter>

    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#ground)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="430" fill="url(#sheen)"/>
  </g>

  <g filter="url(#panelShadow)">
    <!-- active pane: full height, fully opaque -->
    <rect x="200" y="248" width="262" height="528" rx="26" fill="#F8FAFD"/>
    <!-- the other half of the split, itself split again: nesting is the point -->
    <rect x="502" y="248" width="322" height="244" rx="26" fill="#CBD6E6" opacity="0.55"/>
    <rect x="502" y="532" width="322" height="244" rx="26" fill="#CBD6E6" opacity="0.55"/>
  </g>

  <!-- active pane: a file list, with a gutter on the left for marks -->
  <g fill="#A3AFC4">
    <rect x="252" y="292" width="176" height="26" rx="13"/>
    <rect x="252" y="416" width="160" height="26" rx="13"/>
    <rect x="252" y="478" width="122" height="26" rx="13"/>
    <rect x="252" y="602" width="168" height="26" rx="13"/>
    <rect x="252" y="664" width="134" height="26" rx="13"/>
  </g>

  <!-- selection.active -->
  <rect x="240" y="346" width="190" height="42" rx="21" fill="#2F6FC4"/>
  <rect x="256" y="356" width="146" height="22" rx="11" fill="#F8FAFD" opacity="0.93"/>

  <!-- mark.active: its own gutter, never confused with the selection -->
  <circle cx="226" cy="553" r="15" fill="#E88A3C"/>
  <rect x="252" y="540" width="150" height="26" rx="13" fill="#8996AE"/>

  <!-- inactive panes -->
  <g fill="#5C7093" opacity="0.85">
    <rect x="540" y="300" width="146" height="22" rx="11"/>
    <rect x="540" y="356" width="112" height="22" rx="11"/>
    <rect x="540" y="412" width="132" height="22" rx="11"/>

    <rect x="540" y="584" width="138" height="22" rx="11"/>
    <rect x="540" y="640" width="104" height="22" rx="11"/>
    <rect x="540" y="696" width="124" height="22" rx="11"/>
  </g>
</svg>
