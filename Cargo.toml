# jt-filework workspace.
#
# Layout and dependency direction are fixed by docs/adr/0002-repository-and-crate-layout.md
# and enforced by tests/architecture.rs (docs/TESTING.md section 3.2).
#
#   ui -> commands -> workspace -> jobs -> core
#                        |           \
#                        +-> search   +-> platform (traits)
#                        +-> viewer
#                        +-> ai
#   platform-{macos,windows,linux} -> platform (traits) -> core
#
# No crate may depend on `ui`. Only `ui` may depend on a GUI toolkit.
# Only platform adapters may depend on a platform SDK.

[workspace]
resolver = "2"
members = [
    "src/core",
    "src/jobs",
    "src/workspace",
    "src/fs",
    "src/commands",
    "src/cli",
    "src/bench",
    "src/ui/qt6/bridge",
    "tests",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/jasoncheng/jt-filework"
authors = ["jt-filework contributors"]

[workspace.dependencies]
jtf-core = { path = "src/core" }
jtf-jobs = { path = "src/jobs" }
jtf-workspace = { path = "src/workspace" }
jtf-fs = { path = "src/fs" }
jtf-commands = { path = "src/commands" }
jtf-search = { path = "src/search" }
jtf-viewer = { path = "src/viewer" }
jtf-ai = { path = "src/ai" }
jtf-platform = { path = "src/platform" }
jtf-cli = { path = "src/cli" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Applied by every member via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Blocking I/O and panics are architectural failures here, not style issues.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true
