[package]
name = "jtf-app"
description = "The application layer both front ends share: panes, marks, what a command acts on, operations, viewers (ADR-0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# No GUI toolkit and no desktop service, here or below (ADR-0008). Both the Qt
# window and the terminal front end are built on this crate, and the terminal
# one has to install on a machine with no desktop at all.
[dependencies]
jtf-core = { workspace = true }
dirs = { workspace = true }
jtf-imaging = { workspace = true }
jtf-platform-devices = { workspace = true }
jtf-platform-watch = { workspace = true }
jtf-jobs = { workspace = true }
jtf-workspace = { workspace = true }
jtf-commands = { workspace = true }
jtf-fs = { workspace = true }
jtf-ops = { workspace = true }
jtf-viewer = { workspace = true }
jtf-hexedit = { workspace = true }
jtf-transfer = { workspace = true }
jtf-search = { workspace = true }

[lints]
workspace = true
