[package]
name = "jtf-platform-devices"
description = "Finding the removable disks it is safe to offer as a write target."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jtf-core = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Receiving the descriptor `authopen -stdoutpipe` sends over a socket
# (SCM_RIGHTS). Safe wrappers, so the unsafe budget (AGENTS.md 20.1) is
# unaffected.
rustix = { version = "1", features = ["fs", "net"] }

[lints]
workspace = true
