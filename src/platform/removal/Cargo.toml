[package]
name = "jtf-platform-removal"
description = "Removing a tree without a path that can be swapped underneath it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jtf-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Directory-relative syscalls: openat, unlinkat, statat. Safe wrappers, so the
# unsafe budget (AGENTS.md 20.1) is unaffected.
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
