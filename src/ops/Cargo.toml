[package]
name = "jtf-ops"
description = "File operations as cancellable jobs: copy, move, rename, trash, delete, mkdir."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
jtf-core = { workspace = true }
jtf-jobs = { workspace = true }
serde = { workspace = true }
# A user-supplied find expression in batch rename is untrusted input; the
# regex crate has no backtracking, so a crafted pattern cannot hang the
# preview (docs/SECURITY.md 11).
regex = "1"

[lints]
workspace = true
